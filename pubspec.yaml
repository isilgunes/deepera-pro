name: pomodoro_timer
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.0.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.0.0
  google_fonts: ^6.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  path_provider: ^2.1.1
  intl: ^0.19.0
  table_calendar: ^3.0.9
  wakelock_plus: ^1.4.0
  flutter_foreground_task: ^9.2.0
  timezone: ^0.9.0
  flutter_timezone: ^3.0.0
  permission_handler: ^11.3.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.9.0
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  google_sign_in: ^6.2.1
  # path_provider is already included above (2.1.1), updating if needed requires check but ^2.1.1 compatible with 2.1.2 normally.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.0
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#D65A5A" # Matching the app's coral color
  image: "assets/icon/icon.png"
  android_12:
    image: "assets/icon/icon.png"
    color: "#D65A5A"
  web: false
